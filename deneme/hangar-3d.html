<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangar 3D denemesi — Planet Rush</title>
<style>
  :root { --ink:#eaf0ff; --muted:#9aa6c4; --acc:#ffb347; --panel:#0d1430cc; }
  html, body { margin:0; height:100%; background:#050816; color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .top { position:fixed; left:16px; right:16px; top:16px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; pointer-events:none; }
  .title { pointer-events:auto; }
  .title small { display:block; font-size:12px; letter-spacing:3px; color:var(--muted); }
  .title h1 { margin:2px 0 0; font-size:30px; }
  .title p { margin:4px 0 0; color:var(--muted); font-size:14px; }
  .bar { position:fixed; left:16px; right:16px; bottom:max(16px, env(safe-area-inset-bottom)); display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  button, label.btn { appearance:none; border:1px solid #ffffff33; background:var(--panel); color:var(--ink); backdrop-filter:blur(8px);
    min-height:44px; padding:0 16px; border-radius:22px; font:600 14px system-ui, sans-serif; display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
  button[aria-pressed="true"] { border-color:var(--acc); color:var(--acc); }
  label.btn input { display:none; }
  #msg { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); padding:12px 16px; border-radius:12px; background:var(--panel); display:none; }
  @media (max-width: 600px) { .hint { display:none; } button, label.btn { padding:0 12px; font-size:13px; } }
  .hint { position:fixed; right:16px; top:20px; font-size:12px; color:var(--muted); text-align:right; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c" aria-label="Döndürülebilir 3D gemi"></canvas>
<div class="top">
  <div class="title">
    <small>HANGAR · 3D DENEME</small>
    <h1 id="shipName">Öncü</h1>
    <p id="shipPerk">Dengeli, her işi görür.</p>
  </div>
</div>
<div class="hint">Sürükle: döndür<br>İki parmak / tekerlek: yakınlaş</div>
<div id="msg" role="status"></div>
<div class="bar">
  <button id="spinBtn" aria-pressed="true">Otomatik dön</button>
  <button id="resetBtn">Görünümü sıfırla</button>
  <label class="btn">GLB model yükle<input id="glbIn" type="file" accept=".glb,.gltf,model/gltf-binary"></label>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050816);
scene.fog = new THREE.Fog(0x050816, 12, 30);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
const HOME = new THREE.Vector3(4.6, 3.6, 6.6);
camera.position.copy(HOME);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0.3, 0.2, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 3; controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.62;

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x9fb4ff, 0x20140a, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4, 7, 3); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 });
scene.add(key);
const rim = new THREE.DirectionalLight(0x6fa8ff, 1.4); rim.position.set(-5, 2, -4); scene.add(rim);

// ---------- stars ----------
{
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 18 + Math.random() * 10, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    pos.set([r * Math.sin(p) * Math.cos(t), r * Math.cos(p), r * Math.sin(p) * Math.sin(t)], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcfd8ff, size: 0.06, fog: false })));
}

// ---------- hangar pad ----------
const pad = new THREE.Group();
{
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.4, 0.18, 64),
    new THREE.MeshStandardMaterial({ color: 0x141a2e, metalness: 0.7, roughness: 0.5 }));
  disc.receiveShadow = true; disc.position.y = -1.0; pad.add(disc);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.9, 0.025, 8, 96),
    new THREE.MeshBasicMaterial({ color: 0x4fb3ff }));
  ring.rotation.x = Math.PI / 2; ring.position.y = -0.9; pad.add(ring);
  const ring2 = ring.clone(); ring2.scale.setScalar(0.72); ring2.material = new THREE.MeshBasicMaterial({ color: 0xffb347 }); pad.add(ring2);
}
scene.add(pad);

// ---------- procedural ship "Öncü" (built to match art/ship.webp) ----------
const M = {
  navy:  new THREE.MeshStandardMaterial({ color: 0x1f2c4f, metalness: 0.65, roughness: 0.42 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x676d77, metalness: 0.85, roughness: 0.33 }),
  dark:  new THREE.MeshStandardMaterial({ color: 0x23262d, metalness: 0.8, roughness: 0.5 }),
  core:  new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xdff4ff, emissiveIntensity: 2.4 }),
  blue:  new THREE.MeshStandardMaterial({ color: 0x1a6dff, emissive: 0x2a86ff, emissiveIntensity: 3 }),
  cyan:  new THREE.MeshStandardMaterial({ color: 0x38d8ff, emissive: 0x38d8ff, emissiveIntensity: 2 }),
  amber: new THREE.MeshStandardMaterial({ color: 0xffa133, emissive: 0xff9a2a, emissiveIntensity: 2.2 }),
};
function mesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m;
}

function buildVanguard() {
  const ship = new THREE.Group();

  // central hull: layered discs
  ship.add(mesh(new THREE.CylinderGeometry(0.95, 1.0, 0.36, 48), M.navy, 0, 0, 0));
  ship.add(mesh(new THREE.CylinderGeometry(0.78, 0.92, 0.16, 48), M.steel, 0, 0.26, 0));
  ship.add(mesh(new THREE.CylinderGeometry(0.88, 0.95, 0.14, 48), M.dark, 0, -0.25, 0));
  const ringT = mesh(new THREE.TorusGeometry(0.42, 0.07, 16, 48), M.steel, 0, 0.36, 0); ringT.rotation.x = Math.PI / 2; ship.add(ringT);
  const coreS = mesh(new THREE.SphereGeometry(0.32, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), M.core, 0, 0.3, 0); ship.add(coreS);
  // panel segments around the rim + amber lights
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2 + Math.PI / 8;
    const seg = mesh(new THREE.BoxGeometry(0.34, 0.1, 0.18), M.steel, Math.cos(a) * 0.62, 0.32, Math.sin(a) * 0.62);
    seg.rotation.y = -a; ship.add(seg);
    const l = mesh(new THREE.BoxGeometry(0.1, 0.05, 0.05), M.amber, Math.cos(a) * 0.98, 0.06, Math.sin(a) * 0.98);
    l.rotation.y = -a + Math.PI / 2; ship.add(l);
  }

  // swept wings (outline traced from the 2D art, extruded)
  const pts = [[35,-97],[-30,-157],[-100,-189],[-160,-192],[-140,-167],[-90,-117],[-70,-87],[0,-80]].map(([x,z]) => [x / 100, z / 100]);
  const shape = new THREE.Shape(); pts.forEach(([x, z], i) => i ? shape.lineTo(x, z) : shape.moveTo(x, z)); shape.closePath();
  const wingGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.12, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.035, bevelSegments: 2 });
  wingGeo.rotateX(Math.PI / 2); wingGeo.translate(0, 0.08, 0);
  for (const side of [1, -1]) {
    const w = mesh(wingGeo, M.navy); w.scale.z = side; ship.add(w);
    // steel armour plate + amber tip light on each wing
    const plate = mesh(new THREE.BoxGeometry(0.62, 0.05, 0.22), M.steel, -0.75, 0.13, side * 1.35);
    plate.rotation.y = side * 0.62; ship.add(plate);
    ship.add(mesh(new THREE.BoxGeometry(0.12, 0.05, 0.05), M.amber, -1.42, 0.1, side * 1.8));
    const strip = mesh(new THREE.BoxGeometry(0.4, 0.03, 0.03), M.cyan, -0.35, 0.14, side * 1.05); strip.rotation.y = side * 0.62; ship.add(strip);
  }

  // rear engine
  const eng = mesh(new THREE.CylinderGeometry(0.42, 0.46, 0.62, 32), M.dark, -1.25, 0, 0); eng.rotation.z = Math.PI / 2; ship.add(eng);
  const engBand = mesh(new THREE.CylinderGeometry(0.47, 0.47, 0.12, 32), M.steel, -1.1, 0, 0); engBand.rotation.z = Math.PI / 2; ship.add(engBand);
  const nozzle = mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.06, 32), M.blue, -1.58, 0, 0); nozzle.rotation.z = Math.PI / 2; ship.add(nozzle);
  const glow = new THREE.PointLight(0x2a86ff, 6, 4); glow.position.set(-1.9, 0, 0); ship.add(glow);

  // cannon
  ship.add(mesh(new THREE.BoxGeometry(0.55, 0.26, 0.34), M.steel, 1.12, 0.05, 0));
  ship.add(mesh(new THREE.BoxGeometry(0.3, 0.2, 0.42), M.navy, 0.92, 0.05, 0));
  const barrel = mesh(new THREE.CylinderGeometry(0.075, 0.085, 1.4, 20), M.dark, 2.08, 0.05, 0); barrel.rotation.z = Math.PI / 2; ship.add(barrel);
  ship.add(mesh(new THREE.BoxGeometry(1.0, 0.02, 0.03), M.cyan, 2.0, 0.13, 0));
  const tip = mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.12, 20), M.steel, 2.78, 0.05, 0); tip.rotation.z = Math.PI / 2; ship.add(tip);

  return ship;
}

let current = buildVanguard();
scene.add(current);

// ---------- GLB loading (for Higgsfield / Blender models later) ----------
const msg = document.getElementById('msg');
function say(t, ms = 2200) { msg.textContent = t; msg.style.display = 'block'; clearTimeout(say.t); say.t = setTimeout(() => msg.style.display = 'none', ms); }
async function loadModel(buf, name) {
  say('Model yükleniyor…', 60000);
  try {
    const gltf = await new GLTFLoader().parseAsync(buf, '');
    const obj = gltf.scene;
    obj.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
    // Üstten çizilmiş görselden üretilen modeller dik çıkıyor: burun ekseni etrafında 90° yatır
    if (new URLSearchParams(location.search).get('flat') !== '0') {
      const b0 = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
      if (b0.y > Math.min(b0.x, b0.z)) { if (b0.x >= b0.z) obj.rotation.x = Math.PI / 2; else obj.rotation.z = Math.PI / 2; obj.updateMatrixWorld(true); }
    }
    const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    const s = 4.2 / Math.max(size.x, size.y, size.z);
    obj.position.sub(c); const wrap = new THREE.Group(); wrap.add(obj); wrap.scale.setScalar(s);
    scene.remove(current); current = wrap; scene.add(current);
    const base = name.replace(/^.*\//, '').replace(/\.(glb|gltf)$/i, '');
    document.getElementById('shipName').textContent = ({ vanguard: "Öncü" })[base] || base;
    document.getElementById('shipPerk').textContent = 'Higgsfield 3D model';
    say('Model yüklendi');
    window.__modelLoaded = true;
  } catch (err) { say('Model açılamadı: ' + err.message, 4000); }
}
document.getElementById('glbIn').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (f) loadModel(await f.arrayBuffer(), f.name);
});
// ?model=../models/web/vanguard.glb  (yalnızca yerel sunucuda / http üzerinden çalışır)
const qm = new URLSearchParams(location.search).get('model');
if (qm) fetch(qm).then(r => r.arrayBuffer()).then(b => loadModel(b, qm)).catch(e => say('Model indirilemedi: ' + e.message, 4000));

// ---------- controls ----------
const spinBtn = document.getElementById('spinBtn');
spinBtn.onclick = () => { controls.autoRotate = !controls.autoRotate; spinBtn.setAttribute('aria-pressed', controls.autoRotate); };
document.getElementById('resetBtn').onclick = () => { camera.position.copy(HOME); controls.target.set(0.3, 0.2, 0); };

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < h ? 50 : 38; camera.updateProjectionMatrix();
  HOME.set(4.6, 3.6, 6.6).multiplyScalar(w < h ? 1.45 : 1);
  if (!resize.done) { camera.position.copy(HOME); resize.done = true; }
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  current.position.y = Math.sin(t * 1.3) * 0.08;
  current.rotation.x = Math.sin(t * 0.9) * 0.03;
  controls.update();
  renderer.render(scene, camera);
});
window.__hangarReady = true;
</script>
</body>
</html>
